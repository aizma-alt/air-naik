<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Air Naik!</title>
<meta name="description" content="Hujan tak berhenti. Selamatkan apa yang boleh.">
<!-- Three.js 0.187.0, self hosted: only the classes render.js uses (npm run vendor). 136KB gzip, one request, no second host. -->
<script type="importmap">{"imports":{"three":"./vendor/three.min.js"}}</script>
<link rel="modulepreload" href="./vendor/three.min.js">
<link rel="modulepreload" href="./data.js">
<link rel="modulepreload" href="./sim.js">
<link rel="modulepreload" href="./render.js">
<style>
  html,body{margin:0;height:100%;background:#0b1620;color:#eef4f6;font:16px/1.35 system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
  #app{position:relative;height:100dvh;max-width:520px;margin:0 auto;overflow:hidden;background:linear-gradient(#0d1b26,#1d3344 60%,#2a4a5c);user-select:none;-webkit-user-select:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;opacity:0;transition:opacity .4s}
  .on canvas{opacity:1}
  #app::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,#0000 52%,#0b1620a8)}
  .layer{z-index:2;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:max(16px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
  [hidden]{display:none!important}
  #app:not(.on)::before{content:'';position:absolute;inset:-40px;background:repeating-linear-gradient(100deg,#fff0 0 22px,#cfe2ee22 22px 23px);animation:rain .5s linear infinite}
  @keyframes rain{to{transform:translate(-8px,40px)}}
  h1{font:900 60px/1 system-ui,sans-serif;margin:13vh 0 10px;letter-spacing:-2px;color:#fff3d6;text-shadow:0 4px 0 #0d1b26,0 6px 18px #000a}
  #land p{margin:0;max-width:17em;text-shadow:0 1px 8px #000c}
  button{font:700 22px system-ui,sans-serif;padding:14px 44px;border:0;border-radius:14px;background:#f4d35e;color:#1b1b1b;touch-action:manipulation}
  button:disabled{opacity:.45}
  #mula{margin-top:auto;box-shadow:0 5px 0 #b8962e}
  #mula:enabled{animation:glow .8s infinite alternate}
  @keyframes glow{to{box-shadow:0 5px 0 #b8962e,0 0 0 12px #f4d35e40}}
  footer{margin-top:14px;font-size:12px;opacity:.75}
  #end{justify-content:center;gap:10px;background:#0b1620d9}
  #endS{font:800 64px system-ui,sans-serif}
  #end button{margin-top:18px}
  #hud{pointer-events:none}
  #alert{font-weight:800;font-size:24px;padding:4px 18px;border-radius:999px;color:#111;box-shadow:0 3px 0 #0006;animation:pop .6s}
  @keyframes pop{0%{transform:scale(1.7)}}
  #tag{font-size:13px;height:18px;margin-top:3px;text-shadow:0 1px 4px #000}
  #score{position:absolute;right:14px;top:max(16px,env(safe-area-inset-top));font-weight:800;font-size:20px;text-shadow:0 1px 4px #000}
  #gauge{position:absolute;left:12px;top:17%;width:22px;height:42%;border-radius:6px;overflow:hidden;outline:2px solid #fff6;
    background:linear-gradient(to top,#57cc99 0 14.3%,#f4d35e 14.3% 42.9%,#f08a24 42.9% 78.6%,#e5383b 78.6%)}
  #fill{position:absolute;left:8px;right:0;bottom:0;height:0;background:#a07f55;border-top:3px solid #fff}
  #ping{position:absolute;left:7%;right:7%;top:27%;padding:12px 14px;border-radius:14px;background:#f3fff6;color:#10231a;border-left:8px solid #25a55a;text-align:left;pointer-events:auto;box-shadow:0 8px 24px #0009}
  #ping small{font-weight:700;color:#25a55a}
  #ping p{margin:4px 0 10px;font-size:17px}
  #ping div{display:flex;gap:8px}
  #ping button{flex:1;font-size:15px;padding:12px 6px;border-radius:10px;background:#dfeee4}
  #toast{margin-top:10px;font-weight:800;font-size:21px;padding:4px 14px;border-radius:10px;background:#0b1620cc;opacity:0;transition:opacity .25s}
  #toast.show{opacity:1}
  #gap{flex:1}
  #hint{font-weight:700;font-size:18px;padding:6px 14px;border-radius:10px;background:#000a;animation:pulse .9s infinite alternate}
  @keyframes pulse{to{transform:scale(1.1)}}
  #hands{display:flex;gap:8px;margin-top:10px}
  .hand{width:92px;height:58px;border-radius:12px;background:#0009;outline:2px solid #fff5;font-size:11px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .hand b{font-size:24px;font-weight:400}
  .hand:empty::before{content:'\270B';font-size:24px;opacity:.25}
  #dbg{z-index:3;position:absolute;right:12px;top:52px;margin:0;font:11px/1.3 monospace;color:#9f9;text-align:right;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud" class="layer" hidden>
    <div id="alert"></div><div id="tag"></div><div id="score"></div>
    <div id="gauge"><div id="fill"></div></div>
    <div id="toast"></div>
    <div id="ping" hidden><small></small><p></p><div><button data-a="ok"></button><button data-a="sebar"></button><button data-a="semak"></button></div></div>
    <div id="gap"></div>
    <div id="hint" hidden></div>
    <div id="hands"><div class="hand"></div><div class="hand"></div></div>
  </div>
  <div id="land" class="layer">
    <h1>Air Naik!</h1>
    <p>Hujan tak berhenti. Selamatkan apa yang boleh.</p>
    <button id="mula" disabled>Mula</button>
    <footer>Projek kreatif, bukan produk rasmi.</footer>
  </div>
  <div id="end" class="layer" hidden>
    <div>Bot dah bertolak ke PPS</div>
    <div id="endS"></div>
    <div id="endI"></div>
    <button id="lagi">Main Semula</button>
    <footer>Projek kreatif, bukan produk rasmi.</footer>
  </div>
  <pre id="dbg" hidden></pre>
</div>
<script type="module">
import { BM, T, NODES, ROOMS } from './data.js';
import { createSim, step, tap, score } from './sim.js';

const $ = id => document.getElementById(id), q = new URLSearchParams(location.search), debug = q.has('debug');
const COLORS = ['#57cc99', '#f4d35e', '#f08a24', '#e5383b'];
const LAZY3D = false; // true: Three.js loads on Mula instead of on the landing (fallback if the 3s gate fails)
let sim, view, playing = false, last = 0, msgN = 0, toastT = 0, hint = '', frames = 0, slow = 0, low = false;
function fail(e) { console.error(e); $('land').querySelector('p').textContent = BM.fail; } // WebGL missing or the script did not load

const newSim = () => { sim = createSim(q.has('seed') ? +q.get('seed') : Math.random() * 2 ** 31 | 0, q.has('calm')); view.setSim(sim); msgN = 0; }; // ?calm = no chaos, for tests
const set = (el, k, val) => { if (el['_' + k] !== val) el[k] = el['_' + k] = val; }; // write the DOM only on change

async function boot() {
  const { createView } = await import('./render.js');
  window.__three = Math.round(performance.now()); // ms until Three.js and the game modules have loaded
  view = createView($('c')); newSim(); view.frame(0);
  $('app').classList.add('on'); $('mula').disabled = false;
  window.__ready = Math.round(performance.now()); // ms from navigation to Mula enabled with 3D drawn
  if (debug) window.__game = { get sim() { return sim; }, view, step, nodes: NODES, rooms: ROOMS };
  requestAnimationFrame(loop);
}

function start(skip) {
  $('land').hidden = $('end').hidden = true; $('hud').hidden = false;
  view.begin(skip); playing = true; ft.length = 0;
}
$('mula').onclick = async () => { try { if (!view) { $('mula').disabled = true; await boot(); } start(false); } catch (e) { fail(e); } };
$('lagi').onclick = () => { newSim(); start(true); };
$('c').addEventListener('pointerdown', e => {
  if (!playing) return;
  const h = view.pick(e.clientX, e.clientY);
  if (h) tap(sim, h.kind, h.id);
});

const ping = $('ping'), pingB = ping.querySelectorAll('button');
ping.querySelector('small').textContent = BM.pingTitle;
[BM.ok, BM.sebarBtn, BM.semakBtn].forEach((t, k) => pingB[k].textContent = t);
ping.onclick = e => { if (e.target.dataset.a) tap(sim, 'ping', e.target.dataset.a); };

function hud(dt) {
  const p = sim.p, hands = $('hands').children;
  if ($('alert')._lvl !== sim.level) { // new alert level: restart the pop animation
    const a = $('alert'); a._lvl = sim.level; a.textContent = BM.levels[sim.level]; a.style.background = COLORS[sim.level];
    a.style.animation = 'none'; a.offsetWidth; a.style.animation = '';
  }
  set($('tag'), 'textContent', sim.level === 2 ? BM.tag : '');
  set($('score'), 'textContent', 'Skor ' + score(sim));
  $('fill').style.height = Math.min(100, sim.t / T.max * 100) + '%'; // the water is the clock
  for (let k = 0; k < 2; k++) {
    const i = p.hands[k] || (p.hands[0] && p.hands[0].d.wt === 3 ? p.hands[0] : null);
    set(hands[k], 'innerHTML', i ? `<b>${i.d.icon}</b>${i.d.name}` : '');
  }
  hint = !sim.held ? 'item' : !sim.banked && p.hands.length ? 'para' : '';
  set($('hint'), 'hidden', !hint); set($('hint'), 'textContent', hint === 'item' ? BM.hint1 : BM.hint2);
  if (sim.msgN !== msgN) { msgN = sim.msgN; set($('toast'), 'textContent', sim.msg); toastT = 1.6; }
  toastT -= dt; set($('toast'), 'className', toastT > 0 ? 'show' : '');
  const g = sim.ping;
  set(ping, 'hidden', !g);
  if (g) { set(ping.querySelector('p'), 'textContent', g.text); pingB.forEach((b, k) => set(b, 'hidden', (g.kind === 'hoax') === (k === 0))); }
}

const ft = [];
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.1) || 0; last = now;
  if (playing) {
    step(sim, dt); hud(dt);
    if (sim.done) {
      playing = false; $('hud').hidden = true; $('end').hidden = false;
      $('endS').textContent = 'Skor ' + score(sim);
      $('endI').textContent = `Barang selamat: ${sim.items.filter(i => i.loc !== 'gone').length} / ${sim.items.length}`;
    }
  }
  view.frame(dt, playing ? hint : '');
  // Slow phone guard: if frames 20 to 140 average under 40 fps, draw at 65% resolution from then on.
  if (!low && dt > 0 && document.visibilityState === 'visible' && ++frames > 20) {
    slow += dt;
    if (frames === 140) { low = true; window.__low = slow / 120 > 1 / 40; if (window.__low) view.quality(0.65); }
  }
  if (debug && dt && (playing || !sim.started)) { // FPS over the whole run, frozen on the end screen; p5 = 95th percentile frame time
    ft.push(dt); if (ft.length > 9000) ft.shift();
    if (ft.length % 20 === 0) {
      const s = [...ft].sort((a, b) => a - b), avg = ft.length / ft.reduce((a, b) => a + b, 0), p5 = 1 / s[Math.floor(s.length * 0.95)];
      window.__fps = { avg: Math.round(avg), p5: Math.round(p5) };
      $('dbg').hidden = false; $('dbg').textContent = `fps ${Math.round(avg)} p5 ${Math.round(p5)}\nready ${window.__ready}ms${window.__low ? ' low-res' : ''}\nt ${sim.t.toFixed(1)} seed ${sim.seed}`;
    }
  }
}

if (LAZY3D) $('mula').disabled = false; else boot().catch(fail);
</script>
</body>
</html>
